# ── Build settings (수정 불필요) ──────────────────────────────
lang: en
timezone: Asia/Seoul
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
permalink: /posts/:year/:month/:day/:title/
plugins:
  - jekyll-seo-tag
  - jekyll-feed
feed:
  path: feed.xml
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
